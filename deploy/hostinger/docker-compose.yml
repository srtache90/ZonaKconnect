name: zona-k-hostinger

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: zona-k-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal-java
    networks:
      - zona_k

  postgres:
    image: postgres:16-alpine
    container_name: zona-k-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - zona_k

  db-migrate:
    image: postgres:16-alpine
    container_name: zona-k-db-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../../database/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in $$(ls /migrations/*.sql | sort); do
          echo "Applying migration: $$f"
          psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations complete"
    networks:
      - zona_k

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: zona-k-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - zona_k

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    container_name: zona-k-minio-init
    restart: "no"
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Esperando MinIO..."
        i=0
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "MinIO no respondió a tiempo"
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing local/$${AWS_S3_INVOICE_DOCUMENTS_BUCKET}
        mc mb --ignore-existing local/$${AWS_S3_RECEIVED_INVOICES_BUCKET}
        echo "Buckets listos"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_S3_INVOICE_DOCUMENTS_BUCKET: ${AWS_S3_INVOICE_DOCUMENTS_BUCKET}
      AWS_S3_RECEIVED_INVOICES_BUCKET: ${AWS_S3_RECEIVED_INVOICES_BUCKET}
    networks:
      - zona_k

  dian-net:
    build:
      context: ../..
      dockerfile: DIAN_NET/Dockerfile
    container_name: zona-k-dian-net
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      DianConfig__Mock__Enabled: "${DIAN_MOCK_ENABLED:-false}"
      DianConfig__Certificado__Path: ${DIAN_CERT_PATH:-/certs/dian-certificate.p12}
      DianConfig__Certificado__Password: ${DIAN_CERT_PASSWORD}
    volumes:
      - ./certs:/certs:ro
    networks:
      - zona_k

  core-go:
    build:
      context: ../../microservice-core-go
    container_name: zona-k-core-go
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DIAN_API_URL: http://dian-net:8080
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      dian-net:
        condition: service_started
    networks:
      - zona_k

  portal-java:
    build:
      context: ../../microservice-portal-java
    container_name: zona-k-portal-java
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: hostinger
      SERVICES_CORE_GO_BASE_URL: http://core-go:8080
      DIAN_API_URL: http://dian-net:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-28800}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_OVERRIDE: ${AWS_S3_ENDPOINT_OVERRIDE:-http://minio:9000}
      AWS_S3_INVOICE_DOCUMENTS_BUCKET: ${AWS_S3_INVOICE_DOCUMENTS_BUCKET}
      AWS_S3_RECEIVED_INVOICES_BUCKET: ${AWS_S3_RECEIVED_INVOICES_BUCKET}
      MAIL_DISPATCH_ENABLED: ${MAIL_DISPATCH_ENABLED:-true}
      MAIL_RECEPTION_ENABLED: ${MAIL_RECEPTION_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      core-go:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - zona_k

networks:
  zona_k:
    name: zona-k-hostinger
    driver: bridge

volumes:
  postgres_data:
    name: zona-k-hostinger-postgres
  minio_data:
    name: zona-k-hostinger-minio
  caddy_data:
    name: zona-k-hostinger-caddy-data
  caddy_config:
    name: zona-k-hostinger-caddy-config
