<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead(${moduleName + ' - Reportes | Zona K e-Docs'})}"></th:block>
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="dc-page dc-page-wide dc-page-narrow px-margin-mobile md:px-margin-desktop">
    <div class="mb-8">
        <h2 class="font-headline-lg text-headline-lg text-primary mb-2" th:text="'Reportes - ' + ${moduleName}">Reportes</h2>
        <p class="font-body-md text-on-surface-variant" th:text="${moduleDescription}">Descripción del módulo.</p>
    </div>

    <section class="card zk-card p-4 text-center">
        <h3 class="font-headline-md text-headline-md text-primary mb-3">Reportes en preparación</h3>
        <p class="font-body-md text-on-surface-variant mb-0">
            Este módulo contará con reportes analíticos y exportaciones normativas propias.
        </p>
    </section>
</main>

<div th:replace="~{portal/fragments/portal-nav :: bottomNav(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
</body>
</html>
