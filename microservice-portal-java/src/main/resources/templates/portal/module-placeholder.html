<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona K e-Docs</title>
    <link rel="icon" type="image/png" th:href="@{/imagen/zonak.png}" href="/imagen/zonak.png">
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="dc-page dc-page-wide dc-page-narrow px-margin-mobile md:px-margin-desktop">
    <section class="card zk-card p-4 text-center">
        <p class="font-label-sm text-on-surface-variant mb-2">Módulo</p>
        <h2 class="font-headline-lg text-headline-lg text-primary mb-3" th:text="${moduleTitle}">Módulo</h2>
        <p class="font-body-md text-on-surface-variant mb-6" th:text="${moduleDescription}">Descripción del módulo.</p>
        <p class="font-body-md text-on-surface-variant">Funcionalidad en preparación.</p>

<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
