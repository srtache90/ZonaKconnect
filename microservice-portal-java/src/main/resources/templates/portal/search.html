<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead('Búsqueda | Zona K e-Docs')}"></th:block>
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="dc-page dc-page-wide px-margin-mobile md:px-margin-desktop">
    <div class="mb-5"><p class="dc-page-subtitle mb-1">Zona K</p><h1 class="dc-page-title">Búsqueda global</h1>
        <p class="dc-page-subtitle">Prefijo, número, CUFE/CUDE, NIT o razón social</p>
    </div>

    <form class="card zk-card mb-4" th:action="@{/portal/search}" method="get">
        <div class="card-body row g-3 align-items-end">
            <div class="col-md-9">
                <label class="form-label" for="q">Término</label>
                <input class="form-control" id="q" name="q" th:value="${q}"
                       placeholder="Ej. SETP990000001, NIT o nombre" minlength="2" autofocus>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100" type="submit">Buscar</button>
            </div>
        </div>
    </form>

    <div class="alert alert-warning rounded-4" th:if="${q != null and !#strings.isEmpty(q) and #strings.length(q) &lt; 2}">
        Ingrese al menos 2 caracteres.
    </div>

    <section class="card zk-card" th:if="${q != null and #strings.length(q) &gt;= 2}">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span>Resultados</span>
            <span class="text-muted small" th:text="${#lists.size(results)} + ' documento(s)'">0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tipo</th>
                    <th>Documento</th>
                    <th>Nombre</th>
                    <th>Estado DIAN</th>
                    <th>Kind</th>
                    <th class="text-end">Abrir</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${results}">
                    <td>
                        <span class="badge"
                              th:classappend="${row['tipo'] == 'RECIBIDA'} ? ' text-bg-light' : ' text-bg-primary'"
                              th:text="${row['tipo']}">EMITIDA</span>
                    </td>
                    <td>
                        <span th:text="${row['prefijo']}">SETP</span>
                        <span th:text="${row['numero']}">1</span>
                    </td>
                    <td th:text="${row['nombre']}">Cliente</td>
                    <td th:text="${row['estado_dian']}">ENVIADO</td>
                    <td th:text="${row['document_kind']}">INVOICE</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:if="${row['tipo'] == 'EMITIDA'}"
                           th:href="@{/portal/invoices}">Emisión</a>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:if="${row['tipo'] == 'RECIBIDA'}"
                           th:href="@{/portal/recepcion/bandeja}">Recepción</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="6" class="text-center text-muted py-4">Sin coincidencias.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{portal/fragments/portal-nav :: bottomNav(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
</body>
</html>
