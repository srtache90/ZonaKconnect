<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead('Documento Soporte | Zona K e-Docs')}"></th:block>
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="dc-page dc-page-wide px-margin-mobile md:px-margin-desktop">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <h1 class="dc-page-title">Documento soporte</h1>
            <p class="dc-page-subtitle">Emisión y consulta de documentos soporte (DS) por sociedad.</p>
        </div>
        <a class="btn btn-zk rounded-pill px-4" th:href="@{/portal/documento-soporte/nuevo}">Nuevo documento soporte</a>
    </div>

    <div class="alert alert-success rounded-4" th:if="${success != null}" th:text="${success}"></div>
    <div class="alert alert-danger rounded-4" th:if="${error != null}" th:text="${error}"></div>

    <section class="card zk-card">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span>Documentos emitidos</span>
            <span class="badge text-bg-secondary" th:text="'Registros: ' + ${totalRegistros}">Registros: 0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead>
                <tr>
                    <th>Documento</th>
                    <th>Proveedor</th>
                    <th>Identificación</th>
                    <th class="text-end">Total</th>
                    <th>Estado DIAN</th>
                    <th>Fecha</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(documents)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No hay documentos soporte para la sociedad activa.
                    </td>
                </tr>
                <tr th:each="doc : ${documents}">
                    <td th:text="${doc.documento}">DS1</td>
                    <td th:text="${doc.partyName}">Proveedor</td>
                    <td th:text="${doc.partyId}">NIT</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(doc.total, 1, 'POINT', 2, 'COMMA')}">0</td>
                    <td><span class="badge text-bg-light border" th:text="${doc.estadoDian}">PENDIENTE</span></td>
                    <td th:text="${doc.createdAt}">2026-01-01</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{portal/fragments/portal-nav :: bottomNav(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
</body>
</html>
