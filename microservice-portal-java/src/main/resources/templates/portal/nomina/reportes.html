<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead('Reportes Nómina | DIAN Connect')}"></th:block>
    <style>
        .report-table { font-size: 0.85rem; }
        .report-table th { white-space: nowrap; }
        .cufe-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="pt-24 pb-32 px-margin-mobile md:px-margin-desktop max-w-[1400px] mx-auto">
    <div class="mb-8">
        <h2 class="font-headline-lg text-headline-lg text-primary mb-2">Reportes de nómina electrónica</h2>
        <p class="font-body-md text-on-surface-variant">Nómina transmitida, validada y pendiente.</p>
    </div>

    <section class="glass-card rounded-2xl p-6 mb-6">
        <h3 class="font-headline-md text-headline-md text-primary mb-4">Filtros</h3>
        <form method="get" th:action="@{/portal/nomina-electronica/reportes}" class="grid md:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
                <label class="block font-label-md mb-1" for="sociedadId">Sociedad</label>
                <select class="w-full rounded-xl border border-surface-container-highest bg-surface px-3 py-2"
                        id="sociedadId" name="sociedadId">
                    <option th:each="sociedad : ${sociedades}"
                            th:value="${sociedad.id}"
                            th:selected="${sociedad.id.toString() == selectedSociedadId}"
                            th:text="${sociedad.razonSocial + ' - ' + sociedad.nit}">Sociedad</option>
                </select>
            </div>
            <div>
                <label class="block font-label-md mb-1" for="fromDate">Desde</label>
                <input class="w-full rounded-xl border border-surface-container-highest bg-surface px-3 py-2"
                       type="date" id="fromDate" name="fromDate" th:value="${fromDate}">
            </div>
            <div>
                <label class="block font-label-md mb-1" for="toDate">Hasta</label>
                <input class="w-full rounded-xl border border-surface-container-highest bg-surface px-3 py-2"
                       type="date" id="toDate" name="toDate" th:value="${toDate}">
            </div>
            <div>
                <label class="block font-label-md mb-1" for="estadoDian">Estado DIAN</label>
                <input class="w-full rounded-xl border border-surface-container-highest bg-surface px-3 py-2"
                       type="text" id="estadoDian" name="estadoDian"
                       placeholder="Ej: ACEPTADO" th:value="${estadoDian}">
            </div>
            <div class="flex items-end gap-2">
                <button class="px-4 py-2 rounded-xl bg-primary text-on-primary font-label-md" type="submit">Consultar</button>
                <a class="px-4 py-2 rounded-xl border border-surface-container-highest font-label-md text-decoration-none"
                   th:href="@{/portal/nomina-electronica/reportes/export(
                       sociedadId=${selectedSociedadId},
                       fromDate=${fromDate},
                       toDate=${toDate},
                       estadoDian=${estadoDian})}">CSV</a>
            </div>
        </form>
    </section>

    <section class="glass-card rounded-2xl overflow-hidden">
        <div class="flex items-center justify-between px-6 py-4 border-b border-surface-container-highest">
            <h3 class="font-headline-md text-headline-md text-primary">Resultados</h3>
            <span class="px-3 py-1 rounded-full bg-surface-container-low font-label-sm"
                  th:text="'Registros: ' + ${totalRegistros}">Registros: 0</span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full report-table">
                <thead class="bg-surface-container-low">
                <tr>
                    <th class="text-left px-4 py-3">Documento</th>
                    <th class="text-left px-4 py-3" th:text="${partyLabel}">Trabajador</th>
                    <th class="text-left px-4 py-3">Identificación</th>
                    <th class="text-right px-4 py-3">Total</th>
                    <th class="text-left px-4 py-3">Fecha</th>
                    <th class="text-left px-4 py-3">Estado</th>
                    <th class="text-left px-4 py-3">CUFE/CUNE</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td colspan="7" class="px-4 py-8 text-center text-on-surface-variant">
                        No hay nóminas para los filtros seleccionados.
                    </td>
                </tr>
                <tr th:each="row : ${rows}" class="border-t border-surface-container-highest">
                    <td class="px-4 py-3" th:text="${row.documento}">NI1</td>
                    <td class="px-4 py-3" th:text="${row.partyName}">Trabajador</td>
                    <td class="px-4 py-3" th:text="${row.partyId}">CC</td>
                    <td class="px-4 py-3 text-right"
                        th:text="${#numbers.formatDecimal(row.total, 1, 'POINT', 2, 'COMMA')}">0</td>
                    <td class="px-4 py-3" th:text="${row.createdAt}">2026-01-01</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 rounded-full text-[11px] font-label-sm bg-surface-container-low"
                              th:text="${row.estadoDian}">PENDIENTE</span>
                    </td>
                    <td class="px-4 py-3 cufe-cell" th:title="${row.cufe}" th:text="${row.cufe}">CUNE</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div th:replace="~{portal/fragments/portal-nav :: bottomNav(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
</body>
</html>
