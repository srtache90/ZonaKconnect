server:
  port: 8081

services:
  core-go:
    base-url: ${SERVICES_CORE_GO_BASE_URL:${CORE_GO_BASE_URL:http://core-go:8080}}
  dian-net:
    base-url: ${DIAN_NET_BASE_URL:http://dian-net:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/zona_k_facturacion}
    username: ${SPRING_DATASOURCE_USERNAME:zona_k_app}
    password: ${SPRING_DATASOURCE_PASSWORD:zona_k_app_local_password}

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-before-production-32-bytes-minimum}
    ttl-seconds: ${JWT_TTL_SECONDS:28800}
  cookie:
    secure: ${JWT_COOKIE_SECURE:false}

mail:
  dispatch-enabled: ${MAIL_DISPATCH_ENABLED:true}
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:no-reply@zonak.local}
  smtp-auth: ${MAIL_SMTP_AUTH:false}
  smtp-starttls: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  reception-enabled: ${MAIL_RECEPTION_ENABLED:true}
  reception-host: ${MAIL_RECEPTION_DEFAULT_HOST:localhost}
  reception-port: ${MAIL_RECEPTION_DEFAULT_PORT:1110}
  reception-protocol: ${MAIL_RECEPTION_PROTOCOL:pop3}
  reception-username: ${MAIL_RECEPTION_DEFAULT_USERNAME:recepcion}
  reception-password: ${MAIL_RECEPTION_DEFAULT_PASSWORD:recepcion}
