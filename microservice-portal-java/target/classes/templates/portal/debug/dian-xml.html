<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead('XML DIAN_NET | DIAN Connect')}"></th:block>
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="container py-4 pt-24 pb-32">
    <div class="mb-4">
        <h1 class="dc-page-title">XML DIAN_NET</h1>
        <p class="dc-page-subtitle">Consulta el último XML que DIAN_NET intentó firmar.</p>
    </div>

    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

    <section class="card shadow-sm mb-4" th:if="${metadata != null}">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0">Último intento de firma</h2>
            <span class="badge text-bg-primary" th:text="${metadata['documentKind']}">Factura</span>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-2">Debug ID</dt>
                <dd class="col-sm-10"><code th:text="${metadata['id']}">debug-id</code></dd>

                <dt class="col-sm-2">Fecha UTC</dt>
                <dd class="col-sm-10" th:text="${metadata['createdAt']}">fecha</dd>

                <dt class="col-sm-2">Ambiente</dt>
                <dd class="col-sm-10" th:text="${metadata['ambiente']}">Habilitacion</dd>

                <dt class="col-sm-2">Identificador</dt>
                <dd class="col-sm-10"><code th:text="${metadata['identifier']}">CUFE</code></dd>

                <dt class="col-sm-2">Archivo</dt>
                <dd class="col-sm-10" th:text="${metadata['fileName']}">factura.xml</dd>

                <dt class="col-sm-2">Firmado</dt>
                <dd class="col-sm-10" th:text="${metadata['signedXmlAvailable']} ? 'Disponible' : 'No disponible'">No disponible</dd>
            </dl>
        </div>
    </section>

    <section class="card shadow-sm" th:if="${xml != null}">
        <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <div>
                <h2 class="h5 mb-0">XML consultado</h2>
                <p class="text-muted mb-0 small" th:text="'Etapa: ' + ${stage}">Etapa</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-sm"
                   th:classappend="${stage == 'original'} ? ' btn-primary' : ' btn-outline-primary'"
                   th:href="@{/portal/debug/dian/xml(stage='original')}">Original</a>
                <a class="btn btn-sm"
                   th:classappend="${stage == 'before-sign'} ? ' btn-primary' : ' btn-outline-primary'"
                   th:href="@{/portal/debug/dian/xml(stage='before-sign')}">Antes de firma</a>
                <a class="btn btn-sm"
                   th:classappend="${stage == 'signed'} ? ' btn-primary' : ' btn-outline-primary'"
                   th:href="@{/portal/debug/dian/xml(stage='signed')}">Firmado</a>
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/portal/debug/dian/xml/download(stage=${stage})}">Descargar XML</a>
            </div>
        </div>
        <div class="card-body">
            <textarea class="form-control font-monospace" rows="28" readonly th:text="${xml}"></textarea>
        </div>
    </section>
</main>
<div th:replace="~{portal/fragments/portal-nav :: bottomNav(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
</body>
</html>
