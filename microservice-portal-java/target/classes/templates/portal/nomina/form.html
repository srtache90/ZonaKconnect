<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead('Nueva Nómina | DIAN Connect')}"></th:block>
</head>
<body class="text-on-surface">
<div th:replace="~{portal/fragments/portal-nav :: sidebar(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: header}"></div>

<main class="container py-4 pt-24 pb-32">
    <div class="mb-4">
        <h1 class="dc-page-title">Emitir nómina electrónica</h1>
        <p class="dc-page-subtitle">Nómina individual con trabajador, periodo, devengados y deducciones.</p>
    </div>

    <div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

    <form th:action="@{/portal/nomina-electronica/emitir}" method="post" id="payrollForm">
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">Sociedad y periodo</div>
            <div class="card-body row g-3">
                <div class="col-12" th:if="${#lists.isEmpty(sociedades) or #lists.isEmpty(puntosVenta)}">
                    <div class="alert alert-warning mb-0">
                        Configure una sociedad y un punto de venta activos antes de emitir.
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="sociedadId">Sociedad</label>
                    <select class="form-select" id="sociedadId" name="sociedadId" onchange="actualizarPuntosVenta()" required>
                        <option value="">Seleccione...</option>
                        <option th:each="sociedad : ${sociedades}"
                                th:value="${sociedad.id}"
                                th:selected="${sociedad.id.toString() == selectedSociedadId}"
                                th:text="${sociedad.razonSocial + ' - ' + sociedad.nit}">Sociedad</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="emissionPointId">Punto de venta</label>
                    <select class="form-select" id="emissionPointId" name="emissionPointId" required>
                        <option value="">Seleccione...</option>
                        <option th:each="punto : ${puntosVenta}"
                                th:value="${punto.id}"
                                th:data-sociedad-id="${punto.sociedadId}"
                                th:selected="${punto.id.toString() == selectedEmissionPointId}"
                                th:text="${punto.codigo + ' - ' + punto.nombre}">PV</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="periodoNomina">Periodo nómina</label>
                    <input class="form-control" id="periodoNomina" name="periodoNomina" type="month"
                           th:value="${defaultPeriodo}" required>
                </div>
            </div>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white">Trabajador</div>
            <div class="card-body row g-3">
                <div class="col-md-3">
                    <label class="form-label" for="tipoIdentificacion">Tipo identificación</label>
                    <select class="form-select" id="tipoIdentificacion" name="tipoIdentificacion">
                        <option value="CC">CC</option>
                        <option value="CE">CE</option>
                        <option value="TI">TI</option>
                        <option value="PA">Pasaporte</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="numeroIdentificacion">Número identificación</label>
                    <input class="form-control" id="numeroIdentificacion" name="numeroIdentificacion" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="nombres">Nombres</label>
                    <input class="form-control" id="nombres" name="nombres" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="apellidos">Apellidos</label>
                    <input class="form-control" id="apellidos" name="apellidos">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="sueldo">Sueldo base</label>
                    <input class="form-control" id="sueldo" name="sueldo" type="number" step="0.01" min="0" value="0">
                </div>
            </div>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span>Devengados</span>
                <button class="btn btn-sm btn-outline-primary" type="button" id="btn-add-devengado">Agregar</button>
            </div>
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Valor</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="devengadosBody">
                    <tr>
                        <td><input class="form-control line-concepto" name="devengados[0].concepto" value="Sueldo"></td>
                        <td><input class="form-control line-valor" name="devengados[0].valor" type="number" step="0.01" min="0" value="0"></td>
                        <td><button class="btn btn-sm btn-outline-danger btn-remove-line" type="button">Quitar</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span>Deducciones</span>
                <button class="btn btn-sm btn-outline-primary" type="button" id="btn-add-deduccion">Agregar</button>
            </div>
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Valor</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="deduccionesBody">
                    <tr>
                        <td><input class="form-control line-concepto" name="deducciones[0].concepto" value="Salud"></td>
                        <td><input class="form-control line-valor" name="deducciones[0].valor" type="number" step="0.01" min="0" value="0"></td>
                        <td><button class="btn btn-sm btn-outline-danger btn-remove-line" type="button">Quitar</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="d-flex justify-content-between">
            <a class="btn btn-outline-secondary" th:href="@{/portal/nomina-electronica}">Volver al listado</a>
            <button class="btn btn-primary" type="submit">Emitir nómina</button>
        </div>
    </form>
</main>

<script>
    const sociedadSelect = document.getElementById('sociedadId');
    const emissionPointSelect = document.getElementById('emissionPointId');

    function actualizarPuntosVenta() {
        const sociedadId = sociedadSelect.value;
        Array.from(emissionPointSelect.options).forEach(option => {
            if (!option.value) {
                option.hidden = false;
                return;
            }
            const match = option.dataset.sociedadId === sociedadId;
            option.hidden = !match;
            if (!match && option.selected) {
                option.selected = false;
            }
        });
        if (!emissionPointSelect.value) {
            const firstVisible = Array.from(emissionPointSelect.options).find(o => o.value && !o.hidden);
            if (firstVisible) {
                firstVisible.selected = true;
            }
        }
    }

    function reindex(tbody, prefix) {
        Array.from(tbody.querySelectorAll('tr')).forEach((row, index) => {
            row.querySelector('.line-concepto').name = `${prefix}[${index}].concepto`;
            row.querySelector('.line-valor').name = `${prefix}[${index}].valor`;
        });
    }

    function bindLineTable(tbodyId, addBtnId, prefix, keepAtLeastOne) {
        const tbody = document.getElementById(tbodyId);
        document.getElementById(addBtnId).addEventListener('click', () => {
            const row = tbody.querySelector('tr').cloneNode(true);
            row.querySelector('.line-concepto').value = '';
            row.querySelector('.line-valor').value = '0';
            tbody.appendChild(row);
            reindex(tbody, prefix);
        });
        tbody.addEventListener('click', event => {
            if (event.target.classList.contains('btn-remove-line')) {
                const rows = tbody.querySelectorAll('tr');
                if (!keepAtLeastOne || rows.length > 1) {
                    event.target.closest('tr').remove();
                    reindex(tbody, prefix);
                }
            }
        });
    }

    bindLineTable('devengadosBody', 'btn-add-devengado', 'devengados', true);
    bindLineTable('deduccionesBody', 'btn-add-deduccion', 'deducciones', false);
    sociedadSelect.addEventListener('change', actualizarPuntosVenta);
    actualizarPuntosVenta();
</script>
<div th:replace="~{portal/fragments/portal-nav :: bottomNav(${navModule}, ${navActive})}"></div>
<div th:replace="~{portal/fragments/portal-nav :: shellScripts}"></div>
</body>
</html>
