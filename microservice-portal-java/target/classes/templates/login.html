<!doctype html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{portal/fragments/portal-nav :: tailwindHead('Login | DIAN Connect')}"></th:block>
</head>
<body class="dc-login-body">
<main class="dc-login-card">
    <div class="dc-login-brand">
        <div class="dc-login-brand-mark">
            <span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
        </div>
        <div>
            <h1>DIAN Connect</h1>
            <p>Portal de facturación electrónica Zona K</p>
        </div>
    </div>

    <div class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}">
        Usuario o contraseña inválidos
    </div>

    <form th:action="@{/login}" method="post" class="vstack gap-3">
        <div>
            <label for="username" class="form-label">Usuario</label>
            <input id="username" name="username" type="text" class="form-control" value="admin" required autofocus>
        </div>
        <div>
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" value="admin" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
    </form>
</main>
</body>
</html>
